<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>生涯樹小遊戲</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Chiron+GoRound+TC:wght@400;500;700&display=swap">
<style>
:root{--bg:#EEF3F0;--surface:#fff;--ink:#14281F;--mute:#5A6B63;--line:#B9C7BF;--btn:#14281F;--btnink:#fff;
--tree:#2E8B57;--kid:#2F6FD6;--pool:#0E94A5;--wind:#D9771A;--skate:#8E4FD1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A15;--surface:#182620;--ink:#E6EFEA;--mute:#93A59B;--line:#3A4E44;--btn:#E6EFEA;--btnink:#0F1A15;--tree:#3FA86C;--kid:#5B92F0;--pool:#27B3C4;--wind:#EE9A44;--skate:#AB78E8}}
:root[data-theme="dark"]{--bg:#0F1A15;--surface:#182620;--ink:#E6EFEA;--mute:#93A59B;--line:#3A4E44;--btn:#E6EFEA;--btnink:#0F1A15;--tree:#3FA86C;--kid:#5B92F0;--pool:#27B3C4;--wind:#EE9A44;--skate:#AB78E8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6}
main{max-width:920px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:clamp(28px,6vw,42px);font-weight:900;margin:8px 0 4px;letter-spacing:.02em}
h2{font-size:20px;margin:0 0 4px}
p{margin:4px 0}.mute{color:var(--mute);font-size:14px}
.steps{display:flex;gap:8px;margin:14px 0 22px;flex-wrap:wrap}
.steps span{font-size:13px;padding:4px 12px;border-radius:99px;border:1.5px solid var(--line);color:var(--mute)}
.steps span.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.steps span.done{border-color:var(--tree);color:var(--tree)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;cursor:pointer}
.btn{background:var(--btn);color:var(--btnink);border:0;border-radius:10px;padding:10px 22px;font-weight:700}
.btn:disabled{opacity:.35;cursor:not-allowed}
.ghost{background:none;border:1.5px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 16px}
button:focus-visible{outline:3px solid var(--kid);outline-offset:2px}
.count{font-size:28px;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:10px 8px;min-height:56px;text-align:center;color:var(--ink);transition:transform .12s,border-color .12s,background .12s}
.card:hover{transform:translateY(-2px)}
.card.sel{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.group{background:var(--surface);border-left:6px solid var(--c);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.group h3{margin:0;color:var(--c);font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--c);color:#fff;border:0;border-radius:8px;padding:6px 12px;font-size:14px;font-weight:500}
.flip{animation:flip .55s both}
@keyframes flip{from{transform:rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
.tray{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:18px;min-height:64px}
.chip.pick{outline:3px solid var(--ink);outline-offset:2px;transform:scale(1.06)}
.chip[draggable=true]{cursor:grab}
.tree{display:flex;flex-direction:column;align-items:center}
.zone{border:2px dashed var(--line);padding:12px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:center;transition:background .15s,border-color .15s;background:var(--surface)}
.zone.over,.zone.ready{border-color:var(--ink);border-style:solid}
.zone .lbl{width:100%;text-align:center;font-size:13px;color:var(--mute);line-height:1.3}
.zone .lbl b{display:block;color:var(--ink);font-size:16px}
.crown{width:min(560px,100%);min-height:150px;border-radius:50%/60% 60% 40% 40%;border-color:var(--pool)}
.branch{width:min(380px,82%);min-height:96px;border-radius:16px;margin-top:-6px;border-color:var(--kid)}
.trunk{width:min(220px,56%);min-height:120px;border-radius:6px;border-color:var(--tree)}
.root{width:min(500px,100%);min-height:96px;border-radius:0 0 50% 50%/0 0 90% 90%;border-color:var(--wind)}
.crown{border-radius:48% 48% 24px 24px/40% 40% 24px 24px;width:min(640px,100%)}.branch{width:min(560px,94%)}.trunk{width:min(460px,90%)}.root{border-radius:24px 24px 50% 50%/24px 24px 40% 40%;width:min(640px,100%)}.zone{padding:16px 18px}.zone .lbl p{margin:6px 0 0;color:var(--ink);font-size:13px}.chips{width:100%}
.fld{display:block;width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;margin:4px 0 12px}
.rng{display:grid;grid-template-columns:130px 1fr 30px;gap:10px;align-items:center;margin:6px 0}.rng input{width:100%}
.rep h3{margin:18px 0 6px;font-size:18px}.rep .layer p{margin:4px 0;font-size:14px}
.tree .zone{position:relative;border:0;background:none;padding:0;border-radius:0;display:block;min-height:0}
.tree .zone svg.bg{position:absolute;inset:0;width:100%;height:100%;z-index:0;overflow:visible}
.tint{fill:color-mix(in srgb,var(--t) 20%,var(--surface))}
.tree .zone .in{position:relative;z-index:1;text-align:center}
.tree .zone .lbl{margin-bottom:8px;font-size:12px;line-height:1.3}.tree .zone .lbl b{font-size:15px}
.tree .zone .chip{font-size:13px;padding:5px 10px}
.tree .crown{width:min(680px,100%);min-height:260px}.tree .crown .in{padding:64px 17% 56px}
.tree .branch{width:min(460px,82%);min-height:150px;margin-top:-30px}.tree .branch .in{padding:34px 20% 26px}
.tree .trunk{width:min(400px,80%);min-height:170px;margin-top:-4px}.tree .trunk .in{padding:14px 24% 44px}
.tree .root{width:min(600px,100%);min-height:140px;margin-top:-6px}.tree .root .in{padding:38px 14% 44px}
.tint{fill:color-mix(in srgb,var(--t) 30%,var(--surface))}
.tree .zone,.tree .zone i{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif}
.tree .zone i{position:absolute;display:block;font-style:normal;pointer-events:none}
.tree .zone .chip{border-radius:99px;padding:6px 14px;box-shadow:0 2px 0 rgba(0,0,0,.18);font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif}
.face{position:absolute;left:50%;top:20px;width:0;height:0;z-index:1}
.eye{width:9px;height:11px;background:var(--ink);border-radius:50%;top:0;z-index:1}.eye.l{left:-40px}.eye.r{left:31px}
.cheek{width:17px;height:9px;border-radius:50%;background:rgba(255,110,150,.55);top:15px}.cheek.l{left:-64px}.cheek.r{left:47px}
.mouth{left:-7px;top:12px;width:14px;height:8px;border:2.5px solid var(--ink);border-top:0;border-radius:0 0 14px 14px}
.fruit{width:17px;height:17px;border-radius:50%;background:#F0566B;box-shadow:inset -3px -3px 0 rgba(0,0,0,.14),inset 3px 3px 0 rgba(255,255,255,.35);z-index:1}.fruit.y{background:#FFC83D}
.leaf{width:28px;height:15px;background:#7BD389;border-radius:50% 0 50% 0;z-index:0}
.peb{border-radius:50%;background:color-mix(in srgb,var(--wind) 35%,var(--surface))}
.sw{position:absolute;width:20px;height:14px;transform:translate(-50%,-50%);z-index:0;pointer-events:none;fill:none;stroke:#6E8A3E;stroke-width:2;stroke-linecap:round}
.tree .crown .in{color:#2B3A1E}.tree .trunk .in{color:#fff}.tree .root .in{color:#3B2A1A}
.tree .zone .lbl b{color:inherit}.tree .zone .mute{color:inherit}
.tree .branch{margin-top:-44px}
.tree .zone .chip{box-shadow:0 0 0 2px #fff,0 3px 0 2px rgba(0,0,0,.18)}
.tree{background:#fff;border-radius:16px;padding:22px 10px 26px;border:1.5px solid var(--line)}
.tree .crown .in,.tree .trunk .in,.tree .root .in,.tree .branch .in{color:#222}
.tree .zone .chip{box-shadow:0 0 0 2px #333}
.tree .crown{width:min(560px,100%);min-height:340px}.tree .crown .in{padding:70px 17% 60px}
.tree .branch{width:min(420px,86%);min-height:170px;margin-top:-44px}.tree .branch .in{padding:50px 25% 30px}
.tree .trunk{width:min(420px,86%);min-height:190px;margin-top:-4px}.tree .trunk .in{padding:20px 24% 44px}
.tree .root{width:min(560px,100%);min-height:150px;margin-top:-6px}.tree .root .in{padding:46px 13% 40px}
.tree .crown .in,.tree .branch .in,.tree .trunk .in{color:#fff}.tree .root .in{color:#3B2A1A}
.tree .zone .chip{box-shadow:0 0 0 2px #fff,0 3px 0 2px rgba(0,0,0,.22)}
.tree .crown .in,.tree .branch .in,.tree .trunk .in,.tree .root .in{color:#222}
.tree .zone .lbl{color:#6B6B6B}.tree .zone .lbl b{color:#222}
.tree .zone .chip{border-radius:6px;box-shadow:none;padding:5px 12px}
.tree .branch{width:min(560px,100%);min-height:170px;margin-top:-10px}.tree .branch .in{padding:50px 20% 30px}
.tree .trunk{width:min(460px,92%);min-height:190px;margin-top:-4px;z-index:2}.tree .trunk .in{padding:22px 24% 50px}
.tree .root{width:min(560px,100%);min-height:170px;margin-top:-40px}.tree .root .in{padding:60px 12% 36px}
.tree .crown{width:min(598px,100%);min-height:283px}
.tree .trunk{width:min(346px,92%)}.tree .trunk .in{padding:22px 20% 50px}.tree .trunk .chips{flex-direction:column;align-items:center}
.tree .root{width:min(440px,100%);margin-top:-6px}.tree .root .in{padding:46px 12% 36px}
#cpbar button{min-height:46px;padding:10px 20px;touch-action:manipulation}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;max-width:92vw;font-size:14px;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.layer{background:var(--surface);border-radius:10px;padding:12px 14px;margin-bottom:8px;border-left:6px solid var(--c)}
.layer b{color:var(--c)}
.layer.empty{opacity:.75;border-left-style:dashed}
ol{padding-left:22px}li{margin:6px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin:8px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<h1>生涯樹探索</h1>
<p class="mute">從 66 張生涯卡挑出最重視的 10 張，再把它們種成一棵屬於你的生涯樹。</p>
<div class="steps" id="steps"></div>
<div id="app"></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const C={
tree:{n:'大樹卡',d:'內在自我、價值觀與信念',zone:'trunk',w:'接受挑戰|做自己|精神層面的滿足|內在的平靜|發展能力與技巧|擁有內在空間|用心/盡力|有影響力|為夢想目標努力|專業-出類拔萃/獨當一面|有後代|擁有與神的聯繫|公平公正|行善|欣賞美|安全感|發揮創造力|擁有自由|獨立自主|自信|赤子之心|勤奮努力|工作有意義感|腳踏實地|誠實正直|生命的深度與厚度|有正義感|講義氣|冒險與刺激|勇於改變|持續的自我探索'},
kid:{n:'小朋友卡',d:'人際關係與支持系統',zone:'branch',w:'和一群人一起打拚|有好朋友可以說心內話|美滿的婚姻|有意義的情愛關係|孝順父母|親密的家庭|有親近的好朋友|讚賞鼓勵別人|幫助別人|自在舒坦的人際關係'},
pool:{n:'游泳池卡',d:'生活形態與休閒時間',zone:'crown',w:'規律的生活|安穩的工作|平凡單純的生活|不要做壞事|什麼事都不做|享受獨處|參與文化藝術活動|旅行看看這世界|持續的學習|豐富多彩的生活|做喜歡的事|趣味的人生|參與宗教政治社團活動'},
wind:{n:'風車卡',d:'外在物質與工作條件',zone:'root',w:'時尚的穿著|錢夠用(沒有經濟負擔)|有房子/有車子|有社會地位擁有聲望|會賺錢/有財富'},
skate:{n:'溜冰鞋卡',d:'身體健康與生活節奏',zone:'root',w:'享受美食|休息與放鬆|發揮體能|接近大自然|運動/健身|擁有健康|長壽'}
};
const Z={
crown:{n:'樹冠與果實層',s:'生活形態與休閒時間',h:'游泳池卡',m:'你最終想呈現給世界的樣貌，或理想中每天展開想過的生活方式。'},
branch:{n:'樹枝與綠葉層',s:'人際關係與支持系統',h:'小朋友卡',m:'由內在自我向外延伸，滋養自己與他人的互動網絡。'},
trunk:{n:'樹幹核心層',s:'內在自我、價值觀與信念',h:'大樹卡',m:'一個人的中心思想與本質，是支撐整棵樹的靈魂。'},
root:{n:'樹根與土壤層',s:'身體健康、物質與工作條件',h:'溜冰鞋卡、風車卡',m:'維持生活生存的基底。如果底層不穩，上方的樹冠就難以伸展。'}
};
const ZK=['crown','branch','trunk','root'];
const ALL=[];for(const k in C)C[k].w.split('|').forEach(t=>ALL.push({t,k}));
const KEY={};ALL.forEach(c=>KEY[c.t]=c.k);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let S;
function init(){S={step:1,deck:shuffle(ALL),picked:[],placed:{},sel:null,miss:{},total:0,hint:false}}
const $=id=>document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.id);toast.id=setTimeout(()=>t.classList.remove('show'),3200)}
function steps(){const n=['① 挑 10 張','② 翻牌分組','③ 樹上的位置','④ 解析與規劃'];
$('steps').innerHTML=n.map((x,i)=>`<span class="${i+1===S.step?'on':i+1<S.step?'done':''}">${x}</span>`).join('')}
function render(){steps();[null,s1,s2,s3,s4][S.step]();window.scrollTo({top:0})}
function s1(){
const n=S.picked.length;
$('app').innerHTML=`<div class="bar"><div><h2>挑出目前人生中最重視、不能沒有的 10 張</h2><p class="mute">點一下選取，再點一次取消。</p></div></div>
<div class="grid" id="grid"></div>
<div class="bar" style="margin-top:18px"><button class="ghost" id="rs">重新洗牌</button><span style="display:flex;align-items:center;gap:14px"><span class="count">${n} / 10</span><button class="btn" id="nx" ${n===10?'':'disabled'}>翻牌看分組</button></span></div>`;
const g=$('grid');
S.deck.forEach(c=>{const b=document.createElement('button');b.className='card'+(S.picked.includes(c.t)?' sel':'');b.textContent=c.t;b.setAttribute('aria-pressed',S.picked.includes(c.t));
b.onclick=()=>{const i=S.picked.indexOf(c.t);if(i>-1)S.picked.splice(i,1);else if(n<10)S.picked.push(c.t);else{toast('已選滿 10 張，請先取消一張再換');return}s1()};g.appendChild(b)});
$('rs').onclick=()=>{S.deck=shuffle(ALL);s1()};
$('nx').onclick=()=>{S.step=2;render()}}
function s2(){
const by={};S.picked.forEach(t=>(by[KEY[t]]=by[KEY[t]]||[]).push(t));
const ks=Object.keys(by).sort((a,b)=>by[b].length-by[a].length);
$('app').innerHTML=`<h2>你的 10 張卡，依圖示與顏色分成 ${ks.length} 組</h2><p class="mute">每個顏色代表生涯樹的一個部位。張數最多的那組，是你最看重的面向。</p><div style="margin-top:14px" id="gs"></div>
<div class="bar" style="margin-top:18px"><button class="ghost" id="bk">重新挑選</button><button class="btn" id="nx">開始種樹</button></div>`;
$('gs').innerHTML=ks.map((k,i)=>`<div class="group flip" style="--c:var(--${k});animation-delay:${i*.15}s"><h3>${C[k].n}　${by[k].length} 張</h3><p class="mute">${C[k].d}</p><div class="chips">${by[k].map(t=>`<span class="chip" style="--c:var(--${k})">${t}</span>`).join('')}</div></div>`).join('');
$('bk').onclick=()=>{S.step=1;render()};
$('nx').onclick=()=>{S.placed={};S.miss={};S.total=0;S.sel=null;S.step=3;render()}}
function place(t,z){
const k=KEY[t];
if(C[k].zone===z){S.placed[t]=z;S.sel=null;
if(Object.keys(S.placed).length===10){toast('10 張都種好了！');setTimeout(()=>{S.step=4;render()},900)}else{s3();toast('種對了：「'+t+'」長在'+Z[z].n)}return}
S.total++;S.miss[t]=(S.miss[t]||0)+1;
const el=document.querySelector('.zone.'+z);if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
toast(S.miss[t]>=2?'答案：「'+t+'」是'+C[k].n+'，要種在'+Z[C[k].zone].n:'「'+t+'」是'+C[k].n+'（'+C[k].d+'），再想想它屬於哪一層？')}
function s3(){
const P={crown:['擺放最頂端：將「游泳池」放在樹的最上層，或包覆住整棵樹。','這是你最終想呈現給世界的樣貌，或是你理想中每天展開想過的生活方式。'],
branch:['擺放向外延伸：將「小朋友」（人際關係）往左右或上方伸展。','代表由內在自我向外延伸，培養自己與他人的互動網絡。'],
trunk:['擺放核心：將「大樹」（內在自我）放在中間偏核心的位置。','代表一個人的中心思想、本質與自我認同，是支撐整棵樹的靈魂。'],
root:['擺放基礎：將「溜冰鞋」（身體）與「風車」（物質／金錢）放在最下方。','維持生活與生存的基底。如果底層不穩，上方的樹冠就難以伸展。']};
const col={crown:'pool',branch:'kid',trunk:'tree',root:'wind'};
const E=(x,y,r)=>`<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*.8}" vector-effect="non-scaling-stroke"/>`;
const cl=E(50,52,40)+E(18,58,19)+E(82,58,19)+E(30,30,22)+E(70,30,22)+E(50,22,24);
const ST=(k,w)=>`fill="none" stroke="${k}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"`;
const ce=a=>`<ellipse cx="${a[0]}" cy="${a[1]}" rx="${a[2]}" ry="${a[2]*1.5}" vector-effect="non-scaling-stroke"/>`;
const cc=SH.CE.map(ce).join('');
const BG={crown:`<g fill="#2A9BAB" stroke="#2A9BAB" stroke-width="5" stroke-linejoin="round">${cc}</g><g fill="#D2EBEF">${cc}</g>`,
branch:SH.bl.map(d=>`<path d="${d}" ${ST('#2F6FD6',7)}/>`).join(''),
trunk:`<path d="${SH.trunk}" fill="#D5E8D4"/><path d="${SH.trunk}" ${ST('#5BA66B',2.5)}/>`,
root:`<path d="${SH.root}" fill="#F6E4CE"/>`+SH.rl.map(d=>`<path d="${d}" ${ST('#D97A1E',4)}/>`).join('')};

const mob=()=>matchMedia('(pointer:coarse)').matches;
const d2b=u=>{const b=atob(u.split(',')[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Blob([a],{type:'image/png'})};
const legacy=t=>{try{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(a);a.focus();a.select();a.setSelectionRange(0,t.length);const ok=document.execCommand('copy');a.remove();return ok}catch(e){return false}};
function copyTree(){try{say('處理中…');copyTreeX()}catch(e){say('發生錯誤：'+(e&&e.message||e));const i=$('cpimg');if(i)i.scrollIntoView({behavior:'smooth'})}}
function copyTreeX(){
const txt=treeTxt(),cv=treeCanvas(),url=cv.toDataURL('image/png'),blob=d2b(url);
const html=`<p><img src="${url}" width="560" alt="我的生涯樹"></p>`;
const img=$('cpimg');img.innerHTML='<h3 style="margin:18px 0 6px">生涯樹圖片</h3><p class="mute">若無法自動複製，請長按圖片，選「拷貝」或「儲存圖片」。</p>';
const im=new Image();im.src=url;im.alt='我的生涯樹';im.style.cssText='max-width:100%;border-radius:10px;border:1.5px solid var(--line)';img.appendChild(im);img.scrollIntoView({behavior:'smooth',block:'nearest'});
const file=new File([blob],'my-career-tree.png',{type:'image/png'});
const ok=()=>say('已複製生涯樹圖'),fail=()=>{say('無法自動複製，請長按下方圖片，選「拷貝」或「儲存圖片」');img.scrollIntoView({behavior:'smooth'})};
const share=()=>{try{if(navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file],title:'我的生涯樹'}).then(()=>{},e=>{if(!e||e.name!=='AbortError')fail()});else fail()}catch(e){fail()}};
const clip=()=>{try{navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([txt],{type:'text/plain'}),'image/png':blob})]).then(ok,()=>{try{navigator.clipboard.write([new ClipboardItem({'image/png':blob})]).then(ok,share)}catch(e){share()}})}catch(e){share()}};
say('圖片已產生在下方；若沒有複製成功，請長按圖片選「拷貝」或「儲存圖片」');
clip()}
function copyPlan(){try{copyPlanX()}catch(e){say('發生錯誤：'+(e&&e.message||e))}}
function copyPlanX(){
const {title,plan}=planOf();
const html='<h3>'+esc(title)+'</h3>'+plan.map(o=>'<p><b>'+esc(o.t)+'</b><br>'+o.body.map(esc).join('<br>')+'</p>').join('');
const txt=title+'\n\n'+plan.map(o=>o.t+'\n'+o.body.join('\n')).join('\n\n');
const done=()=>say('已複製規劃建議');
const panel=()=>{const b=$('cptxt');b.innerHTML='<p class="mute" style="margin-top:16px">無法自動複製，請在下方文字框長按，選「全選」後拷貝：</p>';const ta=document.createElement('textarea');ta.readOnly=true;ta.value=txt;ta.rows=10;ta.className='fld';ta.onfocus=()=>ta.select();b.appendChild(ta)};
const fb=()=>{if(legacy(txt))return done();try{if(navigator.share)navigator.share({title,text:txt}).catch(e=>{if(!e||e.name!=='AbortError')panel()});else panel()}catch(e){panel()}};
const clip=()=>{try{navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([txt],{type:'text/plain'})})]).then(done,fb)}catch(e){fb()}};
clip()}
init();render();
</script>
</body>
</html>
