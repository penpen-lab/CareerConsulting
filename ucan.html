
<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>UCAN 簡易測驗</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eaf2ff;--g1:#dbeafe;--g2:#a5c8ff;--fg:#14233d;--card:#fff;--ac:#2563eb;--mu:#5b6b85;--bd:#cfdcf2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a2f;--g1:#0b1426;--g2:#1e3a8a;--fg:#e8f0ff;--card:#172746;--ac:#5aa2ff;--mu:#9db0cf;--bd:#28406b}}
:root[data-theme="dark"]{--bg:#0e1a2f;--g1:#0b1426;--g2:#1e3a8a;--fg:#e8f0ff;--card:#172746;--ac:#5aa2ff;--mu:#9db0cf;--bd:#28406b}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);background:linear-gradient(160deg,var(--g1),var(--g2)) fixed;color:var(--fg);font:16px/1.6 "Noto Sans TC",system-ui,sans-serif}
main{max-width:420px;margin:0 auto;padding:16px 14px 40px;min-height:100vh;display:flex;flex-direction:column}
h1{font-size:1.3rem;margin:.2em 0}h2{font-size:1rem;color:var(--ac);margin:1em 0 .4em}
.sub{color:var(--mu);font-size:.84rem}
button{width:100%;background:linear-gradient(90deg,#2563eb,#0ea5e9);color:#fff;border:0;border-radius:10px;padding:13px 18px;font-size:.95rem;cursor:pointer}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:13px 14px;margin:10px 0;box-shadow:0 4px 14px rgba(37,99,235,.14)}
.hero{background:linear-gradient(135deg,#1d4ed8,#38bdf8);color:#fff;border:0;text-align:center}.hero .big{font-size:1.8rem;font-weight:700;letter-spacing:.12em}
.card h3{margin:0 0 4px;font-size:.95rem}.rk{display:inline-block;font-size:1.15rem;margin-right:5px;vertical-align:middle}
.rk.tag{background:var(--ac);color:#fff;border-radius:999px;padding:0 9px;font-size:.72rem}
.chip{display:inline-block;background:rgba(37,99,235,.12);color:var(--ac);border-radius:999px;padding:2px 10px;margin:3px 4px 3px 0;font-size:.78rem}
.lb{font-size:.74rem;color:var(--mu);margin-top:7px}
.opts{display:flex;gap:5px;flex-wrap:nowrap;margin-top:14px}
.opts label{flex:1;min-width:0;text-align:center;border:1px solid var(--bd);border-radius:8px;padding:11px 0;cursor:pointer;font-size:.88rem;background:var(--bg);transition:background .15s,color .15s}
.opts input{display:none}
.opts label.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.scale-lb{display:flex;justify-content:space-between;font-size:.68rem;color:var(--mu);margin-top:4px}
#home,#quiz,#res{display:none}
#home.on,#quiz.on,#res.on{display:block}
#home{flex:1;flex-direction:column;justify-content:center}
#home.on{display:flex}
.hbadges{display:flex;gap:8px;justify-content:center;font-size:1.6rem;margin:14px 0}
.statrow{display:flex;gap:8px;margin-top:18px}
.stat{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px 2px;text-align:center;box-shadow:0 4px 14px rgba(37,99,235,.12)}
.stat .num{font-size:1.3rem;font-weight:700;color:var(--ac)}
.stat .lb2{font-size:.7rem;color:var(--mu);margin-top:2px}
.progwrap{margin:4px 0 2px}
.progtxt{display:flex;justify-content:space-between;font-size:.74rem;color:var(--mu);margin-bottom:4px}
.progtrack{height:6px;background:var(--bd);border-radius:5px;overflow:hidden}
.progtrack i{display:block;height:100%;background:linear-gradient(90deg,#60a5fa,#2563eb);transition:width .25s}
.qcard{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px 15px;margin-top:8px;box-shadow:0 4px 14px rgba(37,99,235,.14);min-height:150px;display:flex;flex-direction:column;justify-content:center}
.qtag{display:inline-block;font-size:.7rem;color:var(--ac);background:rgba(37,99,235,.1);border-radius:999px;padding:2px 9px;margin-bottom:8px;align-self:flex-start}
.qtext{font-size:1.02rem;font-weight:600}
</style></head><body><main>

<div id="home" class="on">
<h1>UCAN 簡易測驗</h1>
<p class="sub">依 UCAN 平台的兩大架構(職業興趣探索、共通職能診斷)自編的簡化版,題目為原創,僅供自我探索,非官方測驗。</p>
<div class="statrow">
<div class="stat"><div class="num">28</div><div class="lb2">題目數</div></div>
<div class="stat"><div class="num">1–5</div><div class="lb2">評分級距</div></div>
<div class="stat"><div class="num">2</div><div class="lb2">構面</div></div>
</div>
<button onclick="startQuiz()" style="width:100%;margin-top:18px">開始測驗</button>
</div>

<div id="quiz">
<div class="progwrap"><div class="progtxt"><span id="ptxt"></span><span id="psec"></span></div><div class="progtrack"><i id="pbar" style="width:0%"></i></div></div>
<div class="qcard">
<span class="qtag" id="qtag"></span>
<div class="qtext" id="qtext"></div>
<div class="opts" id="qopts"></div>
<div class="scale-lb"><span>非常不符合</span><span>非常符合</span></div>
</div>
</div>

<div id="res"></div>
</main>
<script>
const H={R:"實作型",I:"研究型",A:"藝術型",S:"社會型",E:"企業型",C:"事務型"};
const HD={R:"喜歡動手操作、機械、戶外與實體工作",I:"喜歡分析、探究原理、解決抽象問題",A:"喜歡創作、表達想法、追求獨特風格",S:"喜歡幫助、教導、陪伴他人",E:"喜歡領導、說服、推動目標與談判",C:"喜歡整理資料、遵循流程、講求精確"};
const interest=[
["R","我喜歡組裝、修理或操作器材。"],["R","相較於坐辦公室,我更喜歡在現場工作。"],
["I","遇到現象時,我會想弄清楚背後的原因。"],["I","我喜歡閱讀研究報告或做實驗。"],
["A","我喜歡用文字、影像或聲音表達想法。"],["A","我重視作品是否有獨特的風格。"],
["S","朋友遇到困難時,我常是被找來聊聊的人。"],["S","我樂於教別人學會一件事。"],
["E","我喜歡在團體中提出方向並說服大家。"],["E","我對創業或銷售企劃有興趣。"],
["C","我習慣把資料與檔案整理得井然有序。"],["C","我喜歡依照明確的步驟與規則完成工作。"]];
const comp=[
["溝通表達","我能把想法清楚、有條理地說給不同對象聽。"],["溝通表達","我會先聽懂對方的意思再回應。"],
["持續學習","我會主動找資源學習新知識或技能。"],["持續學習","犯錯後我會檢討並調整做法。"],
["人際互動","我能與不同背景的人自在相處。"],["人際互動","面對衝突時,我能保持尊重並尋求共識。"],
["團隊合作","我會主動分擔團隊工作並支援夥伴。"],["團隊合作","我能配合團體決議,即使與自己想法不同。"],
["問題解決","遇到問題時,我會蒐集資訊並比較多種解法。"],["問題解決","我能在壓力下冷靜判斷、採取行動。"],
["創新","我常想到與眾不同的點子或改善方式。"],["創新","我願意嘗試新做法,不怕失敗。"],
["工作責任及紀律","我會準時完成答應別人的事。"],["工作責任及紀律","沒人監督時,我也會遵守規範與品質標準。"],
["資訊科技應用","我能熟練使用文書、簡報或試算軟體。"],["資訊科技應用","我會善用網路與數位工具查證和整理資料。"]];
const ICON={R:"🔧",I:"🔬",A:"🎨",S:"🤝",E:"📈",C:"📋"};
const JOB={R:["機械/電機工程師","技術員","廚師","園藝景觀師","設備維修員"],I:["資料科學家","研究員","軟體工程師","藥師","數據分析師"],A:["視覺設計師","編輯/作家","攝影師","影像創作者","建築師"],S:["教師","社工師","心理師","護理師","人資專員"],E:["業務經理","行銷企劃","創業家","律師","專案經理"],C:["會計師","行政管理","稽核人員","資料管理師","財務分析師"]};
const ST={R:"動手能力強、務實可靠,擅長操作工具與排除故障。",I:"邏輯分析與獨立鑽研力強,能從資料中找出關鍵結論。",A:"創意與美感突出,善於用作品傳達想法、打造差異化。",S:"具同理心與傾聽力,擅長引導、陪伴並建立信任。",E:"具領導與說服力,行動導向,能推動資源達成目標。",C:"細心有條理,重視流程與精確,是團隊中穩定可靠的後盾。"};
const CS={"溝通表達":"能清楚傳達想法,適合需要簡報、協調、對外溝通的角色。","持續學習":"適應變化快,能快速上手新領域,職涯轉換彈性大。","人際互動":"容易建立人脈與信任,適合客戶端或跨部門工作。","團隊合作":"善於分工與支援,是團隊凝聚力的來源。","問題解決":"能拆解問題、找出解法,適合專案與技術性挑戰。","創新":"點子多、敢嘗試,適合開發新產品與改善流程。","工作責任及紀律":"值得信賴、重承諾,容易獲得主管託付重任。","資訊科技應用":"善用數位工具提升效率,契合數位轉型的職場。"};

const Q=[...interest.map(q=>({sec:"職業興趣",tag:H[q[0]],key:q[0],text:q[1],group:"I"})),
         ...comp.map(q=>({sec:"共通職能",tag:q[0],key:q[0],text:q[1],group:"C"}))];
let cur=0;const ans=new Array(Q.length).fill(null);

function startQuiz(){
 document.getElementById("home").classList.remove("on");
 document.getElementById("quiz").classList.add("on");
 render();
}
function render(){
 const q=Q[cur];
 document.getElementById("ptxt").innerText=`第 ${cur+1} / ${Q.length} 題`;
 document.getElementById("psec").innerText=q.sec;
 document.getElementById("pbar").style.width=(cur/Q.length*100)+"%";
 document.getElementById("qtag").innerText=q.tag;
 document.getElementById("qtext").innerText=q.text;
 const o=document.getElementById("qopts");
 o.innerHTML=[1,2,3,4,5].map(n=>`<label id="op${n}"><input type="radio" name="cq" value="${n}">${n}</label>`).join("");
 [1,2,3,4,5].forEach(n=>document.getElementById("op"+n).onclick=()=>choose(n));
}
function choose(n){
 ans[cur]=n;
 document.getElementById("op"+n).classList.add("on");
 setTimeout(()=>{
   cur++;
   if(cur>=Q.length){finish();}else{render();}
 },180);
}
function finish(){
 document.getElementById("quiz").classList.remove("on");
 let I={},C={},cc={};
 Q.forEach((q,i)=>{const v=ans[i];if(q.group==="I"){I[q.key]=(I[q.key]||0)+v}else{C[q.key]=(C[q.key]||0)+v;cc[q.key]=(cc[q.key]||0)+1}});
 const ks=Object.keys(H).sort((a,b)=>I[b]-I[a]),code=ks.slice(0,3).join("");
 let h=`<div class="card hero"><div>UCAN 簡易測驗結果</div><div class="big">${code}</div><div>${ks.slice(0,3).map(k=>H[k]).join(" · ")}</div></div>`;
 ks.slice(0,3).forEach(k=>h+=`<div class="card"><h3><span class="rk">${ICON[k]}</span>${H[k]}(${I[k]}/10)</h3><div class="sub">${HD[k]}</div><div class="lb">適合職稱</div>${JOB[k].map(j=>`<span class="chip">${j}</span>`).join("")}<div class="lb">職涯優勢</div><div>${ST[k]}</div></div>`);
 const names=Object.keys(cc).map(k=>[k,C[k]/cc[k]]).sort((a,b)=>b[1]-a[1]);
 h+=`<div class="card"><h3>共通職能(滿分 5)</h3>`+names.map(([k,s])=>`<div class="bar" style="display:flex;align-items:center;gap:6px;margin:6px 0;font-size:.8rem"><span style="width:5.6em;flex-shrink:0">${k}</span><span style="flex:1;height:9px;background:var(--bd);border-radius:5px;overflow:hidden"><i style="display:block;height:100%;background:linear-gradient(90deg,#60a5fa,#2563eb);width:${s*20}%"></i></span><span style="flex-shrink:0">${s.toFixed(1)}</span></div>`).join("")+`</div>`;
 names.slice(0,2).forEach(([k,s])=>h+=`<div class="card"><h3><span class="rk tag">優勢</span>${k}(${s.toFixed(1)})</h3><div>${CS[k]}</div></div>`);
 const w=names[names.length-1];
 h+=`<div class="card"><h3><span class="rk tag">可加強</span>${w[0]}(${w[1].toFixed(1)})</h3><div>${CS[w[0]]}可透過社團、實習或專題刻意練習。</div></div><p class="sub" style="margin:.3em 0 0">興趣分數僅代表相對偏好,不代表能力高低。<br>想取得正式結果,請至教育部 UCAN 平台(ucan.moe.edu.tw)以學校帳號施測。</p>`;
 const r=document.getElementById("res");
 r.innerHTML=h;
 r.classList.add("on");
 window.scrollTo({top:0,behavior:"smooth"});
}
</script></body></html>
