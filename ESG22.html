
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>永續職涯類型評估</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #eef6f0;
    --surface2: rgba(255,255,255,0.72);
    --border:   rgba(74,124,82,0.18);
    --border2:  rgba(74,124,82,0.32);
    --ink:      #1a3d22;
    --ink2:     #2c5c36;
    --ink3:     #4a7c52;
    --ink4:     #7aab82;
    --accent:   #2d7a48;
    --accent2:  #3da060;
    --accent3:  #5cc47c;
    --mist:     #a8d4b0;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Noto Sans TC',sans-serif;
    background:var(--bg); color:var(--ink);
    min-height:100vh; overflow-x:hidden; position:relative;
  }
  body::before{
    content:''; position:fixed; inset:0;
    background:
      radial-gradient(ellipse 70% 55% at 15% 10%,rgba(180,224,190,.45) 0%,transparent 55%),
      radial-gradient(ellipse 50% 65% at 85% 85%,rgba(160,210,175,.3) 0%,transparent 55%),
      radial-gradient(ellipse 35% 35% at 55% 35%,rgba(200,235,208,.25) 0%,transparent 50%);
    pointer-events:none; z-index:0;
  }
  .geo-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .geo-bg svg{width:100%;height:100%;opacity:.055}
  #app{
    position:relative;z-index:1;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:2.4rem 1rem 5rem;
  }

  /* HEADER */
  .quiz-header{text-align:center;margin-bottom:2.4rem;padding-top:.5rem}
  .header-icon{
    font-size:2.4rem;margin-bottom:.5rem;display:block;
    filter:drop-shadow(0 2px 8px rgba(45,122,72,.2));
    animation:leafFloat 4s ease-in-out infinite;
  }
  @keyframes leafFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}
  .quiz-title{
    font-family:'DM Serif Display',serif;
    font-size:clamp(1.5rem,4.5vw,2.3rem);
    color:var(--ink);line-height:1.2;letter-spacing:-.01em;
  }

  /* PROGRESS */
  .progress-wrap{width:100%;max-width:540px;margin-bottom:1.6rem}
  .progress-meta{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:.5rem;font-size:.76rem;color:var(--ink3);letter-spacing:.08em;
  }
  .progress-label{display:flex;align-items:center;gap:.35rem}
  .progress-label::before{content:'◆';color:var(--accent2);font-size:.55rem}
  .progress-track{width:100%;height:5px;background:rgba(74,124,82,.12);border-radius:99px;overflow:hidden}
  .progress-fill{
    height:100%;border-radius:99px;
    background:linear-gradient(90deg,var(--accent),var(--accent3));
    transition:width .5s cubic-bezier(.4,0,.2,1);
    position:relative;box-shadow:0 0 8px rgba(61,160,96,.35);
  }
  .progress-fill::after{
    content:'';position:absolute;right:-1px;top:-2.5px;
    width:10px;height:10px;background:var(--accent3);border-radius:50%;
    box-shadow:0 0 6px rgba(92,196,124,.6);
  }

  /* DOTS */
  .completion-bar{
    display:flex;justify-content:center;gap:.28rem;
    margin-bottom:1.4rem;flex-wrap:wrap;width:100%;max-width:540px;
  }
  .comp-dot{
    width:7px;height:7px;border-radius:2px;
    background:rgba(74,124,82,.14);
    transition:all .3s ease;transform:rotate(45deg);
  }
  .comp-dot.done{background:var(--accent2);box-shadow:0 0 4px rgba(61,160,96,.35)}
  .comp-dot.active{background:var(--accent);transform:rotate(45deg) scale(1.35)}

  /* CARD */
  .card-outer{width:100%;max-width:540px}
  .card{
    width:100%;background:var(--surface2);
    border:1px solid var(--border);border-radius:20px;
    padding:2rem 1.8rem 1.8rem;backdrop-filter:blur(16px);
    box-shadow:0 4px 24px rgba(45,122,72,.08),0 1px 0 rgba(255,255,255,.9) inset;
    position:relative;overflow:hidden;
  }
  .card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,transparent,var(--accent),var(--accent3),var(--accent),transparent);
    opacity:.5;
  }
  .card-deco{
    position:absolute;top:14px;right:18px;
    font-size:3.2rem;font-family:monospace;line-height:1;
    color:var(--accent);opacity:.1;pointer-events:none;font-weight:700;
  }
  .q-text{
    font-size:clamp(.98rem,2.5vw,1.14rem);font-weight:500;line-height:1.8;
    color:var(--ink);margin-bottom:1.5rem;
  }

  /* OPTIONS — no letter key, just bullet dot */
  .options{display:flex;flex-direction:column;gap:.6rem}
  .option{
    display:flex;align-items:flex-start;gap:.75rem;
    padding:.82rem 1rem;border-radius:12px;
    border:1px solid var(--border);background:rgba(255,255,255,.5);
    cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);
    position:relative;overflow:hidden;
    text-align:left;width:100%;color:var(--ink2);
    font-family:inherit;font-size:.9rem;line-height:1.55;
  }
  .option::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(135deg,rgba(61,160,96,.08),rgba(92,196,124,.04));
    opacity:0;transition:opacity .2s;
  }
  .option:hover::before{opacity:1}
  .option:hover{border-color:var(--border2);transform:translateX(3px);box-shadow:0 2px 12px rgba(45,122,72,.1),-2px 0 0 var(--accent2)}
  .option.selected{
    border-color:var(--accent);background:rgba(61,160,96,.08);
    transform:translateX(3px);
    box-shadow:0 2px 12px rgba(45,122,72,.12),-2px 0 0 var(--accent);
    pointer-events:none;
  }
  .option.selected::before{opacity:1}
  .opt-dot{
    width:10px;height:10px;min-width:10px;border-radius:50%;
    border:2px solid rgba(74,124,82,.35);
    background:transparent;
    transition:all .2s;margin-top:5px;flex-shrink:0;
  }
  .option.selected .opt-dot{
    background:var(--accent);border-color:var(--accent);
    box-shadow:0 0 6px rgba(45,122,72,.4);
  }
  .opt-text{flex:1}

  /* ANIMATIONS */
  .card-outer{width:100%;max-width:540px}
  @keyframes slideIn {from{opacity:0;transform:translateX(50px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes slideOut{from{opacity:1;transform:none}to{opacity:0;transform:translateX(-50px) scale(.97)}}
  @keyframes fadeUp  {from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .card.entering{animation:slideIn .34s cubic-bezier(.22,1,.36,1) both}
  .card.exiting {animation:slideOut .2s ease-in both}

  /* INTRO */
  .intro-page{width:100%;max-width:540px;animation:fadeUp .5s ease both}
  .intro-card{
    background:var(--surface2);border:1px solid var(--border);border-radius:20px;
    padding:2.4rem 2rem 2rem;text-align:center;backdrop-filter:blur(16px);
    box-shadow:0 4px 24px rgba(45,122,72,.08),0 1px 0 rgba(255,255,255,.9) inset;
    position:relative;overflow:hidden;
  }
  .intro-card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,transparent,var(--accent),var(--accent3),var(--accent),transparent);
    opacity:.5;
  }
  .intro-deco{font-size:2.8rem;color:var(--mist);margin-bottom:1.1rem;line-height:1}
  .intro-desc{
    font-size:.9rem;line-height:2.1;color:var(--ink2);
    margin-bottom:1.6rem;
  }
  .intro-features{
    display:grid;grid-template-columns:repeat(2,1fr);
    gap:.7rem;margin-bottom:1.6rem;text-align:left;
  }
  .intro-feat{
    padding:.75rem .9rem;border-radius:10px;
    background:rgba(74,124,82,.07);border:1px solid var(--border);
    font-size:.8rem;color:var(--ink3);
    display:flex;align-items:center;gap:.45rem;
  }
  .btn-start{
    width:100%;padding:.88rem;border-radius:12px;border:none;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;font-family:inherit;font-size:.92rem;font-weight:600;
    letter-spacing:.06em;cursor:pointer;transition:all .2s;
    display:flex;align-items:center;justify-content:center;gap:.5rem;
    box-shadow:0 4px 16px rgba(45,122,72,.2);
  }
  .btn-start:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 6px 20px rgba(45,122,72,.28)}
  .btn-start:active{transform:none}

  /* RESULT */
  .result-page{width:100%;max-width:600px;animation:fadeUp .5s ease both}
  .result-header{text-align:center;margin-bottom:1rem}
  .result-badge{
    display:inline-flex;align-items:center;gap:.45rem;
    background:rgba(61,160,96,.1);border:1px solid rgba(61,160,96,.3);
    border-radius:99px;padding:.35rem 1.1rem;
    font-size:.72rem;color:var(--accent);letter-spacing:.12em;font-weight:600;
  }
  .result-badge::before{content:'●';font-size:.5rem}

  .score-overview{
    background:var(--surface2);border:1px solid var(--border);border-radius:16px;
    padding:1.3rem 1.5rem;margin-bottom:1.3rem;backdrop-filter:blur(16px);
    box-shadow:0 4px 20px rgba(45,122,72,.07),0 1px 0 rgba(255,255,255,.9) inset;
  }
  .score-overview h3{
    font-size:.7rem;letter-spacing:.12em;color:var(--ink3);margin-bottom:1rem;
    display:flex;align-items:center;gap:.35rem;
  }
  .score-overview h3::before{content:'◆';color:var(--accent2);font-size:.5rem}
  .score-row{display:flex;align-items:center;gap:.75rem;margin-bottom:.65rem}
  .score-label{width:76px;font-size:.76rem;color:var(--ink3);flex-shrink:0}
  .score-bar-track{flex:1;height:7px;background:rgba(74,124,82,.1);border-radius:99px;overflow:hidden}
  .score-bar-fill{height:100%;border-radius:99px;transition:width 1s cubic-bezier(.4,0,.2,1);width:0}
  .score-bar-fill.type-a{background:linear-gradient(90deg,#2d7a48,#5cc47c)}
  .score-bar-fill.type-b{background:linear-gradient(90deg,#2a6870,#4db8c0)}
  .score-bar-fill.type-c{background:linear-gradient(90deg,#6b4fa8,#a87fd6)}
  .score-bar-fill.type-d{background:linear-gradient(90deg,#7a6a1a,#c8a840)}
  .score-count{width:24px;text-align:right;font-size:.8rem;font-weight:700;color:var(--accent)}

  .type-card{
    background:var(--surface2);border:1px solid var(--border);border-radius:20px;
    overflow:hidden;margin-bottom:1.1rem;backdrop-filter:blur(16px);
    box-shadow:0 4px 20px rgba(45,122,72,.07),0 1px 0 rgba(255,255,255,.9) inset;
  }
  .type-card.primary{border-color:rgba(45,122,72,.4)}
  .type-card.primary::before{
    content:'';display:block;height:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent3));opacity:.6;
  }
  .type-card-header{padding:1.3rem 1.5rem .9rem;display:flex;align-items:flex-start;gap:.9rem}
  .type-icon{
    width:48px;height:48px;border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    font-size:1.4rem;flex-shrink:0;
  }
  .type-icon.a{background:rgba(45,122,72,.1);border:1px solid rgba(45,122,72,.2)}
  .type-icon.b{background:rgba(42,104,112,.1);border:1px solid rgba(42,104,112,.2)}
  .type-icon.c{background:rgba(107,79,168,.1);border:1px solid rgba(107,79,168,.2)}
  .type-icon.d{background:rgba(122,106,26,.1);border:1px solid rgba(122,106,26,.2)}
  .type-info{flex:1}
  .type-rank{font-size:.66rem;letter-spacing:.12em;color:var(--ink4);margin-bottom:.18rem}
  .type-rank.gold{color:var(--accent)}
  .type-name{font-size:1.1rem;font-weight:700;color:var(--ink);margin-bottom:.18rem}
  .type-direction{font-size:.76rem;color:var(--ink3)}
  .divider{height:1px;background:var(--border);margin:0 1.5rem 1rem}
  .type-card-body{padding:0 1.5rem 1.3rem}
  .type-section{margin-bottom:1rem}
  .type-section-title{
    font-size:.68rem;letter-spacing:.1em;color:var(--accent2);
    margin-bottom:.5rem;display:flex;align-items:center;gap:.3rem;font-weight:600;
  }
  .type-section-title::before{content:'▸'}

  /* job tags — pill row */
  .tag-list{display:flex;flex-wrap:wrap;gap:.35rem}
  .tag{
    padding:.22rem .65rem;border-radius:99px;
    font-size:.74rem;line-height:1.5;
    background:rgba(74,124,82,.07);border:1px solid var(--border);color:var(--ink2);
  }
  .tag.job{border-color:rgba(45,122,72,.3);color:var(--accent);background:rgba(45,122,72,.07)}

  .tag.str{color:var(--ink2)}
  .tag.lrn{border-color:rgba(107,79,168,.25);color:#5a3a8a;background:rgba(107,79,168,.06)}
</style>
</head>
<body>

<div class="geo-bg">
  <svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <polygon points="0,0 220,0 110,190" fill="#4a7c52"/>
    <polygon points="1200,0 980,0 1090,190" fill="#4a7c52"/>
    <polygon points="600,0 710,190 490,190" fill="#2d7a48"/>
    <polygon points="0,800 220,800 110,610" fill="#3da060"/>
    <polygon points="1200,800 980,800 1090,610" fill="#3da060"/>
    <polygon points="310,420 410,590 210,590" fill="#5cc47c"/>
    <polygon points="890,180 990,350 790,350" fill="#2d7a48"/>
    <polygon points="110,580 160,666 60,666" fill="#5cc47c"/>
    <polygon points="1090,180 1140,266 1040,266" fill="#5cc47c"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#4a7c52" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="800" stroke="#4a7c52" stroke-width="1"/>
    <rect x="555" y="355" width="90" height="90" fill="none" stroke="#3da060" stroke-width="1" transform="rotate(45,600,400)"/>
    <circle cx="200" cy="200" r="110" fill="none" stroke="#4a7c52" stroke-width="0.8"/>
    <circle cx="1000" cy="600" r="140" fill="none" stroke="#4a7c52" stroke-width="0.8"/>
    <circle cx="600" cy="400" r="200" fill="none" stroke="#3da060" stroke-width="0.5"/>
  </svg>
</div>

<div id="app"></div>

<script>
const questions = [
  { t:'當公司要推動ESG專案，你最想負責哪一塊？',      o:[{v:'A',t:'規劃整體策略與方向'},{v:'B',t:'分析數據與碳排影響'},{v:'C',t:'對外溝通與品牌曝光'},{v:'D',t:'整理資料與執行細節'}] },
  { t:'你比較喜歡哪種工作節奏？',                    o:[{v:'A',t:'同時管理多個專案與進度'},{v:'B',t:'長時間專注分析數據'},{v:'C',t:'常與人開會、討論與簡報'},{v:'D',t:'有明確流程，穩定執行任務'}] },
  { t:'以下哪一項你最有興趣學？',                    o:[{v:'A',t:'專案管理與策略規劃'},{v:'B',t:'碳盤查與LCA分析'},{v:'C',t:'簡報表達與品牌溝通'},{v:'D',t:'報告書撰寫與資料整理'}] },
  { t:'遇到複雜問題時，你通常會？',                  o:[{v:'A',t:'拆解問題並規劃解決策略'},{v:'B',t:'收集數據找出原因'},{v:'C',t:'與他人討論找共識'},{v:'D',t:'依照流程逐步處理'}] },
  { t:'哪一個最像你？',                              o:[{v:'A',t:'喜歡掌控全局、規劃方向'},{v:'B',t:'邏輯強、重視精準與細節'},{v:'C',t:'擅長表達、重視人際互動'},{v:'D',t:'穩定可靠、執行力高'}] },
  { t:'當工作壓力大時，你會？',                      o:[{v:'A',t:'重新調整策略與優先順序'},{v:'B',t:'更專注在數據與問題本身'},{v:'C',t:'找人討論或尋求支持'},{v:'D',t:'按部就班完成該做的事'}] },
  { t:'以下哪個最吸引你？',                          o:[{v:'A',t:'設計企業ESG發展藍圖'},{v:'B',t:'計算碳排與減碳策略'},{v:'C',t:'推動CSR活動與品牌形象'},{v:'D',t:'撰寫永續報告書'}] },
  { t:'你最有成就感的時刻是？',                      o:[{v:'A',t:'專案成功推動、達成目標'},{v:'B',t:'數據分析出關鍵洞察'},{v:'C',t:'被認同、影響他人想法'},{v:'D',t:'任務順利完成、流程順暢'}] },
  { t:'你在團隊中通常扮演？',                        o:[{v:'A',t:'領導與決策角色'},{v:'B',t:'技術或分析支援'},{v:'C',t:'溝通橋樑與協調者'},{v:'D',t:'執行與落地角色'}] },
  { t:'你比較偏好哪種學習？',                        o:[{v:'A',t:'案例分析與策略思考'},{v:'B',t:'技術工具與數據操作'},{v:'C',t:'溝通技巧與表達訓練'},{v:'D',t:'SOP與實務操作'}] },
  { t:'理想工作比較像？',                            o:[{v:'A',t:'顧問 / 專案負責人'},{v:'B',t:'分析師 / 工程師'},{v:'C',t:'品牌 / CSR負責人'},{v:'D',t:'企業內部ESG專員'}] },
  { t:'你最重視哪一點？',                            o:[{v:'A',t:'影響決策與企業方向'},{v:'B',t:'專業深度與技術能力'},{v:'C',t:'人與社會的影響力'},{v:'D',t:'穩定與確實完成工作'}] }
];

// shuffle helper
function shuffle(arr){ return arr.map(v=>({v,sort:Math.random()})).sort((a,b)=>a.sort-b.sort).map(v=>v.v) }

const types = {
  A:{ name:'策略規劃型', icon:'🧭', iconClass:'a', direction:'ESG顧問 / 永續專案管理',
      jobs:['ESG顧問','永續發展專案經理','企業永續策略規劃師','ESG管理師'],
      strengths:['全局思維與系統規劃能力','目標設定與專案推動力','跨組織協調與決策判斷'],
      learn:['ESG國際框架（GRI/TCFD/ISSB）','OKR與專案管理工具','企業永續策略案例研究'] },
  B:{ name:'數據分析型', icon:'📊', iconClass:'b', direction:'碳管理 / 永續數據分析',
      jobs:['碳盤查專員','永續數據分析師','碳排放管理工程師','ESG資料分析師'],
      strengths:['數據收集與量化分析能力','邏輯嚴謹與細節掌控','環境科學與減碳技術知識'],
      learn:['碳盤查實務（ISO 14064）','Python / Excel數據分析','ESG評分與評級機制'] },
  C:{ name:'溝通推廣型', icon:'📣', iconClass:'c', direction:'CSR / 永續品牌傳播',
      jobs:['CSR專員','永續品牌行銷專員','企業社會責任推廣專員','ESG溝通顧問'],
      strengths:['跨部門溝通與利害關係人管理','品牌故事化與內容傳播','影響力建立與公眾表達'],
      learn:['永續報告書撰寫技巧','利害關係人溝通框架','ESG品牌與媒體策略'] },
  D:{ name:'執行落地型', icon:'⚙️', iconClass:'d', direction:'企業ESG內部執行',
      jobs:['ESG專員','永續推動辦公室專員','供應鏈永續稽核員','ESG報告書編撰專員'],
      strengths:['SOP執行與細節管理能力','穩定可靠與高完成率','資料整理與制度建立'],
      learn:['永續報告書填報實務','ESG評鑑與供應鏈標準','內部ESG稽核流程'] }
};

let S = { screen:'intro', current:0, answers:[], sel:null, locked:false, shuffled:[] };

function render() {
  const app = document.getElementById('app');
  if (S.screen==='intro')  app.innerHTML = renderIntro();
  if (S.screen==='quiz')   {
    app.innerHTML = renderQuiz();
    setTimeout(()=>{ const c=app.querySelector('.card'); if(c) c.classList.add('entering'); },10);
  }
  if (S.screen==='result') {
    app.innerHTML = renderResult();
    setTimeout(()=>{ document.querySelectorAll('.score-bar-fill').forEach(e=>e.style.width=e.dataset.w); },200);
  }
}

function hdr() {
  return `<div class="quiz-header">
    <span class="header-icon">🌿</span>
    <h1 class="quiz-title">永續職涯類型評估</h1>
  </div>`;
}

function renderIntro() {
  return `${hdr()}
  <div class="intro-page"><div class="intro-card">
    <div class="intro-deco">✦</div>
    <p class="intro-desc">透過12道情境題<br>結合自我探索與產業理解的職涯盤點<br>在永續浪潮中<br>看見自己的關鍵角色與可能性</p>
    <div class="intro-features">
      <div class="intro-feat">📝 12道情境題</div>
      <div class="intro-feat">⏱️ 約1-3分鐘</div>
    </div>
    <button class="btn-start" onclick="startQuiz()">
      <span>開始測驗</span><span>→</span>
    </button>
  </div></div>`;
}

function renderQuiz() {
  const q = questions[S.current], n = questions.length, pct = (S.current/n)*100;
  const opts = S.shuffled[S.current].map((opt, i) => {
    const sel = S.sel===i ? 'selected' : '';
    return `<button class="option ${sel}" onclick="pick(${i})">
      <span class="opt-dot"></span><span class="opt-text">${opt.t}</span>
    </button>`;
  }).join('');
  const dots = Array.from({length:n},(_,i)=>{
    let c='comp-dot'; if(i<S.current) c+=' done'; if(i===S.current) c+=' active';
    return `<div class="${c}"></div>`;
  }).join('');
  return `${hdr()}
  <div class="progress-wrap">
    <div class="progress-meta">
      <div class="progress-label">永續職涯類型評估進度</div>
      <span>${S.current+1} / ${n}</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
  </div>
  <div class="completion-bar">${dots}</div>
  <div class="card-outer"><div class="card">
    <div class="card-deco">${String(S.current+1).padStart(2,'0')}</div>
    <p class="q-text">${q.t}</p>
    <div class="options">${opts}</div>
  </div></div>`;
}

function renderResult() {
  const c={A:0,B:0,C:0,D:0};
  S.answers.forEach(({v})=>{ c[v]++; });
  const sorted = Object.entries(c).sort((a,b)=>b[1]-a[1]);
  const top2 = sorted.slice(0,2), n = questions.length;

  const bars = sorted.map(([k,v])=>{
    const pct = Math.round(v/n*100);
    return `<div class="score-row">
      <div class="score-label">${types[k].name.replace('型','')}</div>
      <div class="score-bar-track"><div class="score-bar-fill type-${k.toLowerCase()}" data-w="${pct}%"></div></div>
      <div class="score-count">${v}</div>
    </div>`;
  }).join('');

  const cards = top2.map(([k],idx)=>{
    const t=types[k];
    const rankLabel = idx===0 ? '✦ 永續職涯主要類型' : '◆ 永續職涯輔助類型';
    const rankCls   = idx===0 ? 'gold' : '';
    const primary   = idx===0 ? 'primary' : '';
    return `<div class="type-card ${primary}">
      <div class="type-card-header">
        <div class="type-icon ${t.iconClass}">${t.icon}</div>
        <div class="type-info">
          <div class="type-rank ${rankCls}">${rankLabel}</div>
          <div class="type-name">${t.name}</div>
          <div class="type-direction">永續方向：${t.direction}</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="type-card-body">
        <div class="type-section">
          <div class="type-section-title">職務參考</div>
          <div class="tag-list">${t.jobs.map(j=>`<span class="tag job">${j}</span>`).join('')}</div>
        </div>
        <div class="type-section">
          <div class="type-section-title">永續核心優勢</div>
          <div class="tag-list">${t.strengths.map(s=>`<span class="tag str">✓ ${s}</span>`).join('')}</div>
        </div>
        <div class="type-section">
          <div class="type-section-title">持續學習方向</div>
          <div class="tag-list">${t.learn.map(l=>`<span class="tag lrn">◎ ${l}</span>`).join('')}</div>
        </div>
      </div>
    </div>`;
  }).join('');

  return `${hdr()}
  <div class="result-page">
    <div class="result-header"><div class="result-badge">✦ 測驗完成</div></div>
    <div class="score-overview"><h3>永續特質</h3>${bars}</div>
    ${cards}
  </div>`;
}

function startQuiz() {
  // Pre-shuffle all question options
  const shuffled = questions.map(q => shuffle([...q.o]));
  S = { screen:'quiz', current:0, answers:[], sel:null, locked:false, shuffled };
  render();
}

function pick(idx) {
  if (S.locked || S.sel !== null) return;
  S.sel = idx; S.locked = true;
  document.querySelectorAll('.option').forEach((el,i)=>{ if(i===idx) el.classList.add('selected'); });
  const card = document.querySelector('.card');
  if (card) {
    setTimeout(()=>{ card.classList.add('exiting'); setTimeout(()=>advance(), 195); }, 270);
  } else { advance(); }
}

function advance() {
  // Record the value (A/B/C/D) of the selected shuffled option
  const selected = S.shuffled[S.current][S.sel];
  S.answers.push(selected);
  if (S.current < questions.length-1) {
    S.current++; S.sel=null; S.locked=false; render();
  } else {
    S.screen='result'; render();
  }
}

render();
</script>
</body>
</html>
