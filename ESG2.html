
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESG職涯定位測驗</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --g1: #0d4f3c;
    --g2: #1a7a5e;
    --g3: #2aab82;
    --g4: #4fd6a8;
    --g5: #a8f0d6;
    --g6: #d4faf0;
    --accent: #00ffb3;
    --dark: #061a12;
    --mid: #0a2e1f;
    --card-bg: rgba(10,40,28,0.85);
    --text-main: #e8fff6;
    --text-sub: #7dd4b0;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--dark);
    color: var(--text-main);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Geometric background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(42,171,130,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 80%, rgba(13,79,60,0.35) 0%, transparent 60%),
      radial-gradient(ellipse 40% 40% at 60% 30%, rgba(79,214,168,0.08) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .geo-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .geo-bg svg {
    width: 100%;
    height: 100%;
    opacity: 0.07;
  }

  /* Main wrapper */
  #app {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 2rem 1rem 4rem;
  }

  /* Header */
  .quiz-header {
    text-align: center;
    margin-bottom: 2.5rem;
    padding-top: 1rem;
  }

  .header-icon {
    font-size: 2.8rem;
    margin-bottom: 0.5rem;
    display: block;
    filter: drop-shadow(0 0 16px var(--accent));
    animation: iconPulse 3s ease-in-out infinite;
  }

  @keyframes iconPulse {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 16px var(--accent)); }
    50% { transform: scale(1.06); filter: drop-shadow(0 0 28px var(--accent)); }
  }

  .quiz-title {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    background: linear-gradient(135deg, var(--g5) 0%, var(--accent) 50%, var(--g4) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.2;
    letter-spacing: -0.02em;
    text-shadow: none;
  }

  .quiz-subtitle {
    margin-top: 0.6rem;
    font-size: 0.92rem;
    color: var(--text-sub);
    font-weight: 300;
    letter-spacing: 0.05em;
  }

  /* Progress bar */
  .progress-wrap {
    width: 100%;
    max-width: 560px;
    margin-bottom: 1.8rem;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.5rem;
    font-size: 0.78rem;
    color: var(--text-sub);
    letter-spacing: 0.08em;
  }

  .progress-label { display: flex; align-items: center; gap: 0.4rem; }
  .progress-label::before { content: '◆'; color: var(--accent); font-size: 0.6rem; }

  .progress-track {
    width: 100%;
    height: 6px;
    background: rgba(42,171,130,0.15);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--g3), var(--accent));
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    box-shadow: 0 0 12px rgba(0,255,179,0.5);
  }

  .progress-fill::after {
    content: '';
    position: absolute;
    right: -1px;
    top: -2px;
    width: 10px;
    height: 10px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent);
  }

  /* Card */
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--card-bg);
    border: 1px solid rgba(79,214,168,0.2);
    border-radius: 20px;
    padding: 2rem 1.8rem 1.8rem;
    backdrop-filter: blur(20px);
    box-shadow:
      0 8px 40px rgba(0,0,0,0.4),
      0 0 0 1px rgba(79,214,168,0.05),
      inset 0 1px 0 rgba(255,255,255,0.05);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--g3), var(--accent), var(--g3), transparent);
    opacity: 0.8;
  }

  /* Corner deco */
  .card-deco {
    position: absolute;
    top: 16px; right: 20px;
    opacity: 0.12;
    font-size: 3.5rem;
    color: var(--accent);
    font-family: monospace;
    line-height: 1;
    pointer-events: none;
  }

  /* Question number tag */
  .q-tag {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    background: linear-gradient(135deg, rgba(42,171,130,0.2), rgba(0,255,179,0.1));
    border: 1px solid rgba(0,255,179,0.3);
    border-radius: 99px;
    padding: 0.25rem 0.8rem;
    font-size: 0.72rem;
    color: var(--accent);
    letter-spacing: 0.1em;
    font-weight: 500;
    margin-bottom: 1rem;
  }

  .q-tag .dot {
    width: 5px; height: 5px;
    background: var(--accent);
    border-radius: 50%;
    animation: blink 1.5s ease-in-out infinite;
  }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .q-category {
    font-size: 0.7rem;
    color: var(--text-sub);
    opacity: 0.7;
    margin-left: 0.3rem;
  }

  .q-text {
    font-size: clamp(1rem, 2.5vw, 1.18rem);
    font-weight: 500;
    line-height: 1.7;
    margin-bottom: 1.6rem;
    color: var(--text-main);
  }

  /* Options */
  .options { display: flex; flex-direction: column; gap: 0.7rem; }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 0.8rem;
    padding: 0.85rem 1rem;
    border-radius: 12px;
    border: 1px solid rgba(79,214,168,0.15);
    background: rgba(255,255,255,0.02);
    cursor: pointer;
    transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
    text-align: left;
    width: 100%;
    color: var(--text-main);
    font-family: inherit;
    font-size: 0.92rem;
    line-height: 1.5;
  }

  .option::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(42,171,130,0.12), rgba(0,255,179,0.06));
    opacity: 0;
    transition: opacity 0.22s;
  }

  .option:hover::before { opacity: 1; }
  .option:hover {
    border-color: rgba(0,255,179,0.4);
    transform: translateX(4px);
    box-shadow: 0 4px 20px rgba(0,255,179,0.1), -3px 0 0 var(--accent);
  }

  .option:active { transform: translateX(2px) scale(0.99); }

  .option.selected {
    border-color: var(--accent);
    background: rgba(0,255,179,0.08);
    box-shadow: 0 4px 20px rgba(0,255,179,0.15), -3px 0 0 var(--accent);
    transform: translateX(4px);
  }

  .option.selected::before { opacity: 1; }

  .opt-key {
    width: 28px;
    height: 28px;
    min-width: 28px;
    border-radius: 8px;
    background: rgba(42,171,130,0.15);
    border: 1px solid rgba(42,171,130,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--g4);
    letter-spacing: 0;
    transition: all 0.22s;
    margin-top: 1px;
  }

  .option.selected .opt-key {
    background: var(--accent);
    color: var(--dark);
    border-color: var(--accent);
    box-shadow: 0 0 10px rgba(0,255,179,0.4);
  }

  .opt-text { flex: 1; }

  /* Card flip animation */
  .card-outer {
    width: 100%;
    max-width: 560px;
    perspective: 1200px;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(60px) scale(0.97); }
    to   { opacity: 1; transform: translateX(0) scale(1); }
  }

  @keyframes slideOut {
    from { opacity: 1; transform: translateX(0) scale(1); }
    to   { opacity: 0; transform: translateX(-60px) scale(0.97); }
  }

  .card.entering { animation: slideIn 0.38s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .card.exiting  { animation: slideOut 0.25s cubic-bezier(0.4, 0, 1, 1) both; }

  /* Next btn */
  .btn-next {
    margin-top: 1.4rem;
    width: 100%;
    padding: 0.9rem;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--g2), var(--g3));
    color: var(--text-main);
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.22s;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    opacity: 0;
    pointer-events: none;
  }

  .btn-next.visible {
    opacity: 1;
    pointer-events: auto;
    animation: fadeUp 0.3s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .btn-next::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--g3), var(--accent));
    opacity: 0;
    transition: opacity 0.22s;
  }

  .btn-next:hover::before { opacity: 1; }
  .btn-next:hover { box-shadow: 0 6px 24px rgba(0,255,179,0.25); transform: translateY(-1px); }
  .btn-next span { position: relative; z-index: 1; }

  /* ── Result page ── */
  .result-page {
    width: 100%;
    max-width: 620px;
    animation: slideIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .result-header {
    text-align: center;
    margin-bottom: 2rem;
  }

  .result-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: linear-gradient(135deg, rgba(0,255,179,0.15), rgba(42,171,130,0.1));
    border: 1px solid rgba(0,255,179,0.3);
    border-radius: 99px;
    padding: 0.4rem 1.2rem;
    font-size: 0.75rem;
    color: var(--accent);
    letter-spacing: 0.12em;
    font-weight: 600;
    margin-bottom: 1rem;
  }

  .result-title {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    background: linear-gradient(135deg, var(--g5), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.4rem;
  }

  .result-subtitle {
    color: var(--text-sub);
    font-size: 0.88rem;
    font-weight: 300;
  }

  /* Score bars */
  .score-overview {
    background: var(--card-bg);
    border: 1px solid rgba(79,214,168,0.15);
    border-radius: 16px;
    padding: 1.4rem 1.6rem;
    margin-bottom: 1.6rem;
    backdrop-filter: blur(20px);
  }

  .score-overview h3 {
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    color: var(--text-sub);
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .score-overview h3::before { content: '◆'; color: var(--accent); font-size: 0.5rem; }

  .score-row {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin-bottom: 0.7rem;
  }

  .score-label {
    width: 80px;
    font-size: 0.78rem;
    color: var(--text-sub);
    flex-shrink: 0;
  }

  .score-bar-track {
    flex: 1;
    height: 8px;
    background: rgba(255,255,255,0.05);
    border-radius: 99px;
    overflow: hidden;
  }

  .score-bar-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
    width: 0;
  }

  .score-bar-fill.type-a { background: linear-gradient(90deg, #1a7a5e, #4fd6a8); }
  .score-bar-fill.type-b { background: linear-gradient(90deg, #0f5a7a, #4db8d6); }
  .score-bar-fill.type-c { background: linear-gradient(90deg, #6b3fa8, #b47fd6); }
  .score-bar-fill.type-d { background: linear-gradient(90deg, #7a5c1a, #d6b84f); }

  .score-count {
    width: 28px;
    text-align: right;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--accent);
  }

  /* Type cards */
  .type-card {
    background: var(--card-bg);
    border: 1px solid rgba(79,214,168,0.2);
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 1.2rem;
    backdrop-filter: blur(20px);
    position: relative;
  }

  .type-card.primary { border-color: rgba(0,255,179,0.4); }
  .type-card.primary::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--g3), var(--accent));
  }

  .type-card-header {
    padding: 1.4rem 1.6rem 1rem;
    display: flex;
    align-items: flex-start;
    gap: 1rem;
  }

  .type-icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    flex-shrink: 0;
  }

  .type-icon.a { background: linear-gradient(135deg, rgba(26,122,94,0.4), rgba(79,214,168,0.2)); border: 1px solid rgba(79,214,168,0.3); }
  .type-icon.b { background: linear-gradient(135deg, rgba(15,90,122,0.4), rgba(77,184,214,0.2)); border: 1px solid rgba(77,184,214,0.3); }
  .type-icon.c { background: linear-gradient(135deg, rgba(107,63,168,0.4), rgba(180,127,214,0.2)); border: 1px solid rgba(180,127,214,0.3); }
  .type-icon.d { background: linear-gradient(135deg, rgba(122,92,26,0.4), rgba(214,184,79,0.2)); border: 1px solid rgba(214,184,79,0.3); }

  .type-info { flex: 1; }

  .type-rank {
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    color: var(--text-sub);
    margin-bottom: 0.2rem;
  }

  .type-rank.gold { color: var(--accent); }

  .type-name {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 0.2rem;
  }

  .type-direction {
    font-size: 0.78rem;
    color: var(--text-sub);
  }

  .type-card-body {
    padding: 0 1.6rem 1.4rem;
  }

  .type-section {
    margin-bottom: 1rem;
  }

  .type-section-title {
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    color: var(--accent);
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-weight: 600;
  }

  .type-section-title::before { content: '▸'; }

  .tag-list { display: flex; flex-wrap: wrap; gap: 0.4rem; }

  .tag {
    padding: 0.25rem 0.7rem;
    border-radius: 99px;
    font-size: 0.75rem;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text-main);
  }

  .tag.job { border-color: rgba(0,255,179,0.25); color: var(--g5); }
  .tag.strength { border-color: rgba(79,214,168,0.2); color: var(--text-sub); }
  .tag.learn { border-color: rgba(180,127,214,0.25); color: #d4b0f0; }

  .divider {
    height: 1px;
    background: rgba(255,255,255,0.05);
    margin: 0 1.6rem 1rem;
  }

  /* Intro screen */
  .intro-page {
    width: 100%;
    max-width: 560px;
    animation: slideIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .intro-card {
    background: var(--card-bg);
    border: 1px solid rgba(79,214,168,0.2);
    border-radius: 20px;
    padding: 2.4rem 2rem;
    text-align: center;
    backdrop-filter: blur(20px);
    position: relative;
    overflow: hidden;
  }

  .intro-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--g3), var(--accent), var(--g3), transparent);
  }

  .intro-features {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.8rem;
    margin: 1.6rem 0;
    text-align: left;
  }

  .intro-feat {
    padding: 0.8rem;
    border-radius: 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(79,214,168,0.1);
    font-size: 0.82rem;
    color: var(--text-sub);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .intro-feat .fi { font-size: 1.1rem; }

  .btn-start {
    width: 100%;
    padding: 1rem;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--g2), var(--g3));
    color: var(--text-main);
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.22s;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    margin-top: 1rem;
  }

  .btn-start::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--g3), var(--accent));
    opacity: 0;
    transition: opacity 0.22s;
  }

  .btn-start:hover::before { opacity: 1; }
  .btn-start:hover { box-shadow: 0 6px 24px rgba(0,255,179,0.25); transform: translateY(-2px); }
  .btn-start span { position: relative; z-index: 1; }

  .intro-desc {
    color: var(--text-sub);
    font-size: 0.88rem;
    line-height: 1.7;
    margin-top: 1rem;
  }

  /* Geo deco shapes */
  .hex {
    position: fixed;
    opacity: 0.04;
    pointer-events: none;
    z-index: 0;
  }

  .completion-bar {
    display: flex;
    justify-content: center;
    gap: 0.3rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }

  .comp-dot {
    width: 8px; height: 8px;
    border-radius: 2px;
    background: rgba(79,214,168,0.15);
    transition: all 0.3s ease;
    transform: rotate(45deg);
  }

  .comp-dot.done {
    background: var(--accent);
    box-shadow: 0 0 6px rgba(0,255,179,0.5);
  }

  .comp-dot.active {
    background: var(--g3);
    transform: rotate(45deg) scale(1.3);
  }
</style>
</head>
<body>

<!-- Geometric background SVG -->
<div class="geo-bg">
  <svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <polygon points="0,0 200,0 100,173" fill="#2aab82"/>
    <polygon points="1200,0 1000,0 1100,173" fill="#2aab82"/>
    <polygon points="600,0 700,173 500,173" fill="#4fd6a8"/>
    <polygon points="0,800 200,800 100,627" fill="#1a7a5e"/>
    <polygon points="1200,800 1000,800 1100,627" fill="#1a7a5e"/>
    <polygon points="300,400 400,573 200,573" fill="#2aab82"/>
    <polygon points="900,200 1000,373 800,373" fill="#4fd6a8"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#2aab82" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="800" stroke="#2aab82" stroke-width="1"/>
    <rect x="550" y="350" width="100" height="100" fill="none" stroke="#4fd6a8" stroke-width="1" transform="rotate(45,600,400)"/>
    <circle cx="200" cy="200" r="120" fill="none" stroke="#2aab82" stroke-width="1"/>
    <circle cx="1000" cy="600" r="150" fill="none" stroke="#2aab82" stroke-width="1"/>
    <polygon points="100,600 150,686 50,686" fill="#4fd6a8"/>
    <polygon points="1100,200 1150,286 1050,286" fill="#4fd6a8"/>
  </svg>
</div>

<div id="app"></div>

<script>
const questions = [
  { id: 1, cat: '工作偏好', text: '當公司要推動ESG專案，你最想負責哪一塊？',
    opts: ['規劃整體策略與方向','分析數據與碳排影響','對外溝通與品牌曝光','整理資料與執行細節'] },
  { id: 2, cat: '日常工作情境', text: '你比較喜歡哪種工作節奏？',
    opts: ['同時管理多個專案與進度','長時間專注分析數據','常與人開會、討論與簡報','有明確流程，穩定執行任務'] },
  { id: 3, cat: '技能傾向', text: '以下哪一項你最有興趣學？',
    opts: ['專案管理與策略規劃','碳盤查與LCA分析','簡報表達與品牌溝通','報告書撰寫與資料整理'] },
  { id: 4, cat: '面對問題的方式', text: '遇到複雜問題時，你通常會？',
    opts: ['拆解問題並規劃解決策略','收集數據找出原因','與他人討論找共識','依照流程逐步處理'] },
  { id: 5, cat: '人格特質', text: '哪一個最像你？',
    opts: ['喜歡掌控全局、規劃方向','邏輯強、重視精準與細節','擅長表達、重視人際互動','穩定可靠、執行力高'] },
  { id: 6, cat: '壓力情境', text: '當工作壓力大時，你會？',
    opts: ['重新調整策略與優先順序','更專注在數據與問題本身','找人討論或尋求支持','按部就班完成該做的事'] },
  { id: 7, cat: 'ESG技能偏好', text: '以下哪個最吸引你？',
    opts: ['設計企業ESG發展藍圖','計算碳排與減碳策略','推動CSR活動與品牌形象','撰寫永續報告書'] },
  { id: 8, cat: '工作成就感來源', text: '你最有成就感的時刻是？',
    opts: ['專案成功推動、達成目標','數據分析出關鍵洞察','被認同、影響他人想法','任務順利完成、流程順暢'] },
  { id: 9, cat: '跨部門合作', text: '你在團隊中通常扮演？',
    opts: ['領導與決策角色','技術或分析支援','溝通橋樑與協調者','執行與落地角色'] },
  { id: 10, cat: '學習風格', text: '你比較偏好哪種學習？',
    opts: ['案例分析與策略思考','技術工具與數據操作','溝通技巧與表達訓練','SOP與實務操作'] },
  { id: 11, cat: '職涯想像', text: '理想工作比較像？',
    opts: ['顧問 / 專案負責人','分析師 / 工程師','品牌 / CSR負責人','企業內部ESG專員'] },
  { id: 12, cat: '價值觀', text: '你最重視哪一點？',
    opts: ['影響決策與企業方向','專業深度與技術能力','人與社會的影響力','穩定與確實完成工作'] }
];

const types = {
  A: {
    name: '策略規劃型',
    icon: '🧭',
    iconClass: 'a',
    direction: '顧問 / 專案管理',
    jobs: ['ESG顧問', 'ESG專案經理', '永續長（CSO）'],
    strengths: ['全局思維與系統規劃能力', '目標設定與專案推動力', '跨組織協調與決策判斷'],
    learn: ['ESG國際框架（GRI/TCFD/ISSB）', 'OKR與專案管理工具', '企業永續策略案例研究']
  },
  B: {
    name: '數據分析型',
    icon: '📊',
    iconClass: 'b',
    direction: '碳管理 / 數據分析',
    jobs: ['碳盤查分析師', '永續數據工程師', 'LCA生命週期評估師'],
    strengths: ['數據收集與量化分析能力', '邏輯嚴謹與細節掌控', '環境科學與減碳技術知識'],
    learn: ['碳盤查工具（ISO 14064）', 'Python / Excel數據分析', 'ESG評分與評級機制']
  },
  C: {
    name: '溝通推廣型',
    icon: '📣',
    iconClass: 'c',
    direction: 'CSR / 品牌傳播',
    jobs: ['CSR專員', 'ESG品牌行銷經理', '永續報告溝通顧問'],
    strengths: ['跨部門溝通與利害關係人管理', '品牌故事化與內容傳播', '影響力建立與公眾表達'],
    learn: ['永續報告書撰寫技巧', '利害關係人溝通框架', 'ESG品牌與媒體策略']
  },
  D: {
    name: '執行落地型',
    icon: '⚙️',
    iconClass: 'd',
    direction: '企業ESG內部專員',
    jobs: ['ESG專員', '永續推動辦公室執行', '供應鏈ESG稽核人員'],
    strengths: ['SOP執行與細節管理能力', '穩定可靠與高完成率', '資料整理與制度建立'],
    learn: ['永續報告書填報實務', 'ESG評鑑與供應鏈標準', '內部ESG稽核流程']
  }
};

// App state
let state = {
  screen: 'intro', // intro | quiz | result
  current: 0,
  answers: [],
  selectedOption: null,
  exiting: false
};

function render() {
  const app = document.getElementById('app');
  if (state.screen === 'intro') {
    app.innerHTML = renderIntro();
  } else if (state.screen === 'quiz') {
    app.innerHTML = renderQuiz();
    // Animate score bars after render
    setTimeout(() => {
      const card = app.querySelector('.card');
      if (card) card.classList.add('entering');
    }, 10);
  } else {
    app.innerHTML = renderResult();
    setTimeout(() => {
      document.querySelectorAll('.score-bar-fill').forEach(el => {
        el.style.width = el.dataset.width;
      });
    }, 200);
  }
}

function renderIntro() {
  return `
    <div class="quiz-header">
      <span class="header-icon">🌿</span>
      <h1 class="quiz-title">ESG職涯定位測驗</h1>
      <p class="quiz-subtitle">ESG沒有標準答案，但有最適合的位置</p>
    </div>
    <div class="intro-page">
      <div class="intro-card">
        <div style="font-size:3rem;margin-bottom:1rem;">✦</div>
        <p class="intro-desc">透過12道情境題，找出你在ESG領域中最匹配的職涯方向。每題選一個最接近你的選項，不必想太久，跟著直覺走。</p>
        <div class="intro-features">
          <div class="intro-feat"><span class="fi">📝</span> 12道情境題</div>
          <div class="intro-feat"><span class="fi">⏱️</span> 約3-5分鐘</div>
          <div class="intro-feat"><span class="fi">🎯</span> 四大職涯類型</div>
          <div class="intro-feat"><span class="fi">💡</span> 個人化建議</div>
        </div>
        <button class="btn-start" onclick="startQuiz()">
          <span>開始測驗</span><span>→</span>
        </button>
      </div>
    </div>
  `;
}

function renderQuiz() {
  const q = questions[state.current];
  const total = questions.length;
  const pct = (state.current / total) * 100;
  const keys = ['A','B','C','D'];

  const dots = Array.from({length: total}, (_, i) => {
    let cls = 'comp-dot';
    if (i < state.current) cls += ' done';
    if (i === state.current) cls += ' active';
    return `<div class="${cls}"></div>`;
  }).join('');

  const opts = q.opts.map((o, i) => {
    const sel = state.selectedOption === i ? 'selected' : '';
    return `<button class="option ${sel}" onclick="selectOption(${i})">
      <span class="opt-key">${keys[i]}</span>
      <span class="opt-text">${o}</span>
    </button>`;
  }).join('');

  const btnVis = state.selectedOption !== null ? 'visible' : '';
  const isLast = state.current === total - 1;

  return `
    <div class="quiz-header">
      <span class="header-icon">🌿</span>
      <h1 class="quiz-title">ESG職涯定位測驗</h1>
      <p class="quiz-subtitle">ESG沒有標準答案，但有最適合的位置</p>
    </div>
    <div class="progress-wrap">
      <div class="progress-meta">
        <div class="progress-label">題目進度</div>
        <span>${state.current + 1} / ${total}</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" style="width:${pct}%"></div>
      </div>
    </div>
    <div class="completion-bar">${dots}</div>
    <div class="card-outer">
      <div class="card">
        <div class="card-deco">${String(state.current+1).padStart(2,'0')}</div>
        <div class="q-tag">
          <span class="dot"></span>
          題目 ${state.current + 1}
          <span class="q-category">【${q.cat}】</span>
        </div>
        <p class="q-text">${q.text}</p>
        <div class="options">${opts}</div>
        <button class="btn-next ${btnVis}" onclick="nextQuestion()">
          <span>${isLast ? '查看結果 ✦' : '下一題 →'}</span>
        </button>
      </div>
    </div>
  `;
}

function renderResult() {
  const counts = {A:0, B:0, C:0, D:0};
  const keys = ['A','B','C','D'];
  state.answers.forEach(a => { counts[keys[a]]++; });

  const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]);
  const top2 = sorted.slice(0,2);
  const total = questions.length;

  const barsHtml = sorted.map(([k, v]) => {
    const pct = Math.round((v/total)*100);
    return `
      <div class="score-row">
        <div class="score-label">${types[k].name.replace('型','')}</div>
        <div class="score-bar-track">
          <div class="score-bar-fill type-${k.toLowerCase()}" data-width="${pct}%" style="width:0"></div>
        </div>
        <div class="score-count">${v}</div>
      </div>`;
  }).join('');

  const typeCardsHtml = top2.map(([k, v], idx) => {
    const t = types[k];
    const rankLabel = idx === 0 ? '✦ 主要類型' : '◆ 輔助類型';
    const rankCls = idx === 0 ? 'gold' : '';
    const primary = idx === 0 ? 'primary' : '';
    return `
      <div class="type-card ${primary}">
        <div class="type-card-header">
          <div class="type-icon ${t.iconClass}">${t.icon}</div>
          <div class="type-info">
            <div class="type-rank ${rankCls}">${rankLabel}</div>
            <div class="type-name">${t.name}</div>
            <div class="type-direction">職務方向：${t.direction}</div>
          </div>
        </div>
        <div class="divider"></div>
        <div class="type-card-body">
          <div class="type-section">
            <div class="type-section-title">適合職缺</div>
            <div class="tag-list">${t.jobs.map(j=>`<span class="tag job">${j}</span>`).join('')}</div>
          </div>
          <div class="type-section">
            <div class="type-section-title">核心優勢</div>
            <div class="tag-list">${t.strengths.map(s=>`<span class="tag strength">✓ ${s}</span>`).join('')}</div>
          </div>
          <div class="type-section">
            <div class="type-section-title">補強學習項目</div>
            <div class="tag-list">${t.learn.map(l=>`<span class="tag learn">◎ ${l}</span>`).join('')}</div>
          </div>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="quiz-header">
      <span class="header-icon">🌿</span>
      <h1 class="quiz-title">ESG職涯定位測驗</h1>
      <p class="quiz-subtitle">ESG沒有標準答案，但有最適合的位置</p>
    </div>
    <div class="result-page">
      <div class="result-header">
        <div class="result-badge">✦ 測驗完成</div>
        <h2 class="result-title">你的ESG職涯定位</h2>
        <p class="result-subtitle">根據你的12道回答，以下是最符合你的職涯方向</p>
      </div>
      <div class="score-overview">
        <h3>四大類型分佈</h3>
        ${barsHtml}
      </div>
      ${typeCardsHtml}
    </div>
  `;
}

function startQuiz() {
  state.screen = 'quiz';
  state.current = 0;
  state.answers = [];
  state.selectedOption = null;
  render();
}

function selectOption(idx) {
  state.selectedOption = idx;
  render();
  // Animate progress after re-render
  const pct = (state.current / questions.length) * 100;
  const fill = document.querySelector('.progress-fill');
  if (fill) fill.style.width = pct + '%';
}

function nextQuestion() {
  if (state.selectedOption === null) return;
  state.answers.push(state.selectedOption);

  if (state.current < questions.length - 1) {
    const card = document.querySelector('.card');
    if (card) {
      card.classList.remove('entering');
      card.classList.add('exiting');
      setTimeout(() => {
        state.current++;
        state.selectedOption = null;
        render();
        const newPct = (state.current / questions.length) * 100;
        const fill = document.querySelector('.progress-fill');
        if (fill) fill.style.width = newPct + '%';
      }, 220);
    } else {
      state.current++;
      state.selectedOption = null;
      render();
    }
  } else {
    // Show result
    const card = document.querySelector('.card');
    if (card) {
      card.classList.add('exiting');
      setTimeout(() => {
        state.screen = 'result';
        render();
      }, 250);
    } else {
      state.screen = 'result';
      render();
    }
  }
}

// Init
render();
</script>
</body>
</html>
